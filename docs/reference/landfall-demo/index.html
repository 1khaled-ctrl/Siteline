<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  /* One visual world, deep space: full-screen 3D view, a slim top bar, a floating report panel on the trailing side. */
  --bg: #060913;
  --panel: #0c1322;
  --panel-2: #121b30;
  --line: #22304f;
  --text: #e8edf7;
  --muted: #8e9ab5;
  --sun: #f4b63f;
  --earth: #5ba9ff;
  --good: #41cf8f;
  --warn: #f0c050;
  --bad: #ff6f6f;
  --font-display: "Saira Semi Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
html[lang="ar"] body { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; }
body { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: #3a4c80; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--earth); outline-offset: 2px; }
button.primary { background: #263a69; border-color: #3d5694; }
button.sunbtn { background: rgba(244,182,63,.14); border-color: rgba(244,182,63,.6); color: #ffe2a6; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #080d1a; flex-wrap: wrap; z-index: 6; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: .03em; display: flex; align-items: baseline; gap: 10px; }
.brand span { font-family: var(--font-body); font-weight: 400; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
.crumbs { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 4px 6px; color: var(--muted); }
.crumbs button[aria-current="page"] { color: var(--text); }
.crumbs .sep { opacity: .45; }
.timebox { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
.timebox input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-family: var(--font-mono); font-size: 13px; }
.utc { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
main { position: relative; min-height: 0; overflow: hidden; }
#view, #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; font-size: 12px; white-space: nowrap; padding: 2px 7px; border-radius: 6px; background: rgba(8,13,26,.8); border: 1px solid var(--line); color: var(--text); pointer-events: auto; cursor: pointer; }
.lbl.region { border-color: rgba(244,182,63,.65); color: #ffe2a6; }
.lbl.crater { background: none; border: 0; color: #a9b5d2; font-style: italic; pointer-events: none; }
.lbl.sky { background: none; border: 0; font-weight: 600; pointer-events: none; }
.lbl.sky.sun { color: #ffd889; } .lbl.sky.earth { color: #9fd0ff; }
.lbl.site { background: #f2f5fb; color: #0a1020; border-color: #fff; font-weight: 600; pointer-events: none; }
.elbl { position: absolute; left: 0; top: 0; white-space: pre; pointer-events: none; font-size: 12px; line-height: 1.15; text-align: center; font-weight: 500; }
#labels[data-style="map"] .elbl { color: #333a44; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 5px #fff; }
#labels[data-style="dark"] .elbl { color: #f3f6fc; text-shadow: 0 0 2px #000, 0 0 4px #000, 0 0 6px rgba(0,0,0,.85); }
.elbl.big { font-size: 13.5px; }
.elbl.continent { font-size: 15px; letter-spacing: .3em; font-weight: 600; }
#labels[data-style="map"] .elbl.continent { color: #7b828c; }
.elbl.ocean { font-style: italic; letter-spacing: .28em; font-size: 14px; font-weight: 400; }
#labels[data-style="map"] .elbl.ocean { color: #4d87c2; text-shadow: none; }
#labels[data-style="dark"] .elbl.ocean { color: #a9cdfa; }
html[lang="ar"] .elbl { letter-spacing: 0; }
#layerbar input { background: rgba(18,27,48,.92); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; width: 200px; font-size: 12.5px; }
#panel { position: absolute; top: 12px; inset-inline-end: 12px; bottom: 12px; width: 410px; overflow: auto; background: rgba(12,19,34,.95); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 22px; z-index: 4; }
#panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
#panel h3 { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; margin: 18px 0 8px; color: #d3dbef; }
#panel p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .v small { font-size: 12px; color: var(--muted); }
.stat .v.text { font-family: var(--font-body); font-size: 14px; }
.stat.sun { border-inline-start: 3px solid var(--sun); }
.stat.earth { border-inline-start: 3px solid var(--earth); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel-2); }
.chip.good { border-color: rgba(65,207,143,.55); color: #93f0c5; background: rgba(65,207,143,.1); }
.chip.bad { border-color: rgba(255,111,111,.55); color: #ffb6b6; background: rgba(255,111,111,.1); }
.chip.warn { border-color: rgba(240,192,80,.55); color: #ffe19a; background: rgba(240,192,80,.1); }
.verdict { border-radius: 10px; padding: 10px 12px; margin: 10px 0; border: 1px solid; }
.verdict.pass { border-color: rgba(65,207,143,.6); background: rgba(65,207,143,.08); }
.verdict.fail { border-color: rgba(255,111,111,.6); background: rgba(255,111,111,.07); }
.verdict .title { font-family: var(--font-display); font-size: 18px; font-weight: 600; display: block; margin-bottom: 4px; }
canvas.chart { width: 100%; display: block; background: #0a1120; border: 1px solid var(--line); border-radius: 10px; }
.legendrow { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legendrow i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list { display: grid; gap: 6px; }
.list button { text-align: start; display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.cmp th, table.cmp td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
table.cmp td.num, table.cmp th.num { text-align: end; }
.slip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.slip label { display: flex; justify-content: space-between; font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--sun); }
select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
.note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; }
#layerbar { position: absolute; top: 12px; inset-inline-start: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 3; max-width: calc(100% - 460px); }
#layerbar button { font-size: 12.5px; padding: 5px 9px; background: rgba(18,27,48,.92); }
#layerbar button[aria-pressed="true"] { border-color: var(--sun); color: #ffe2a6; background: rgba(60,45,15,.9); }
#legend { position: absolute; inset-inline-start: 12px; top: 56px; z-index: 3; background: rgba(12,19,34,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 240px; }
#legend .bar { height: 8px; border-radius: 4px; margin: 6px 0 2px; }
#legend .ends { display: flex; justify-content: space-between; color: var(--muted); direction: ltr; }
#legend .bar { direction: ltr; }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 3; font-size: 12.5px; color: var(--muted); background: rgba(8,13,26,.78); border-radius: 8px; padding: 5px 10px; white-space: nowrap; }
#copilotBtn { position: absolute; inset-inline-start: 12px; bottom: 12px; z-index: 5; }
#copilot { position: absolute; inset-inline-start: 12px; bottom: 56px; width: min(430px, calc(100% - 24px)); height: min(520px, calc(100% - 80px)); display: flex; flex-direction: column; gap: 8px; background: rgba(12,19,34,.98); border: 1px solid var(--line); border-radius: 12px; padding: 12px; z-index: 6; }
#copilot[hidden] { display: none; }
.cp-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-size: 17px; }
.cp-log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-inline-end: 4px; }
.msg { padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { background: #1d2b4d; align-self: flex-end; max-width: 88%; }
.msg.assistant { background: var(--panel-2); border: 1px solid var(--line); }
.cp-form { display: flex; gap: 6px; }
.cp-form input { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
#cpSuggest button { font-size: 12px; padding: 4px 8px; text-align: start; }
#fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 7; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 8; background: var(--bg); font-family: var(--font-display); font-size: 19px; color: var(--muted); text-align: center; padding: 20px; }
.modal { position: fixed; inset: 0; background: rgba(3,6,14,.75); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal[hidden] { display: none; }
.modal .card { width: min(780px, 100%); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
.modal h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0 0 8px; }
.modal h3 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 18px 0 6px; }
.modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal td, .modal th { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: start; }
.modal .num { text-align: end; }
.modal ul { padding-inline-start: 20px; margin: 6px 0; }
.modal a { color: var(--earth); }
.mlbl { position: absolute; left: 0; top: 0; font-size: 11.5px; white-space: nowrap; padding: 1px 6px; border-radius: 5px; background: rgba(8,13,26,.82); border: 1px solid var(--line); color: var(--text); pointer-events: auto; cursor: pointer; font-weight: 500; }
.mlbl.crew { border-color: rgba(244,182,63,.75); color: #ffe2a6; }
.mlbl.active { border-color: rgba(65,207,143,.8); color: #a8f5d2; }
.mlbl.future { border-color: rgba(120,200,255,.7); color: #bfe3ff; border-style: dashed; }
.mlbl.lost { border-color: rgba(255,111,111,.6); color: #ffc2c2; }
.mlbl.sel { background: #f2f5fb; color: #0a1020; border-color: #fff; }
.flbl { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; font-size: 11.5px; color: #e6ebf6; text-shadow: 0 0 2px #000, 0 0 4px #000, 0 0 7px rgba(0,0,0,.9); font-style: italic; letter-spacing: .02em; }
.flbl.mare, .flbl.plain { font-style: normal; letter-spacing: .16em; font-size: 12.5px; color: #cfd8ea; text-transform: uppercase; }
.flbl.mons { color: #ffe9c2; } .flbl.vallis, .flbl.rima { color: #cfe6ff; }
.flbl.big { font-size: 13.5px; }
.clbl { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; font-size: 11.5px; line-height: 1.1; font-weight: 500; }
#labels[data-style="map"] .clbl { color: #232a33; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 5px #fff; }
#labels[data-style="dark"] .clbl { color: #f3f6fc; text-shadow: 0 0 2px #000, 0 0 4px #000; }
.clbl::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #3b4452; border: 1px solid #fff; margin-inline-end: 4px; vertical-align: 1px; }
.clbl.cap { font-weight: 600; font-size: 12.5px; }
.clbl.cap::before { width: 7px; height: 7px; background: #fff; border-color: #3b4452; }
.mfilters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.mfilters button { font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.mfilters button[aria-pressed="true"] { border-color: var(--sun); color: #ffe2a6; background: rgba(60,45,15,.9); }
.mlist { display: grid; gap: 5px; }
.mlist button { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; text-align: start; width: 100%; padding: 6px 9px; }
.mlist .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.mlist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mlist .dt { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.mcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }
.mcard h3 { margin-top: 0 !important; }
.mcard .meta { font-size: 12.5px; color: var(--muted); }
#mvBox { width: 100%; height: 210px; border-radius: 10px; border: 1px solid var(--line); background: radial-gradient(ellipse at 50% 40%, #1a2440, #070b16); margin-top: 10px; position: relative; overflow: hidden; }
#mvBox canvas { width: 100% !important; height: 100% !important; display: block; }
#mvBox .cap { position: absolute; inset-inline-start: 8px; bottom: 6px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
#hdload { position: absolute; top: 56px; inset-inline-start: 12px; z-index: 3; font-size: 12px; color: var(--muted); background: rgba(8,13,26,.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; }
.srcs { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; padding-inline-start: 18px; }
.srcs a { color: #9fc6ff; }
@media (max-width: 900px) {
  #panel { top: auto; inset-inline: 8px; bottom: 8px; width: auto; max-height: 46%; }
  #layerbar { max-width: calc(100% - 24px); }
  #legend { top: auto; bottom: calc(46% + 18px); }
  #hint { display: none; }
  #copilotBtn { bottom: calc(46% + 18px); }
  #copilot { bottom: 8px; height: calc(100% - 16px); }
  .brand span { display: none; }
}
@media (max-width: 600px) {
  header.top { gap: 6px; padding: 6px 8px; }
  .brand { font-size: 18px; }
  #tPrev, #tNext, .utc { display: none; }
  .timebox { margin-inline-start: 0; }
  .timebox input { font-size: 12px; padding: 4px 6px; }
  #btnCheck, #btnLang { font-size: 12.5px; padding: 5px 8px; }
  #legend { display: none; }
  #layerbar button { font-size: 12px; padding: 4px 7px; }
}
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Landfall <span data-i18n="tagline">Pick a spot. See if you can land there.</span></div>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="timebox">
      <button id="tPrev" type="button" dir="ltr" aria-label="One day earlier">−1 d</button>
      <label class="sr-only" for="dt" data-i18n="dateLabel">Date and time (UTC)</label>
      <input id="dt" type="datetime-local" step="3600">
      <span class="utc">UTC</span>
      <button id="tNext" type="button" dir="ltr" aria-label="One day later">+1 d</button>
      <button id="tNow" type="button" data-i18n="now">Now</button>
    </div>
    <button id="btnCheck" type="button" data-i18n="checked">How we checked it</button>
    <button id="btnLang" type="button">عربي</button>
  </header>
  <main id="main">
    <div id="view"><canvas id="gl"></canvas><div id="labels"></div></div>
    <div id="layerbar" hidden></div>
    <div id="legend" hidden></div>
    <aside id="panel" aria-live="polite"></aside>
    <div id="hdload" hidden></div>
    <div id="hint"></div>
    <button id="copilotBtn" type="button" class="sunbtn" hidden data-i18n="askCopilot">Ask the copilot</button>
    <section id="copilot" hidden aria-label="Mission copilot">
      <div class="cp-head"><span data-i18n="copilot">Mission copilot</span><button id="cpClose" type="button" aria-label="Close">×</button></div>
      <div id="cpLog" class="cp-log"></div>
      <div id="cpSuggest" class="chips"></div>
      <form id="cpForm" class="cp-form"><label class="sr-only" for="cpInput">Message</label><input id="cpInput" autocomplete="off"><button type="submit" class="primary" data-i18n="send">Send</button></form>
    </section>
    <div id="fade"></div>
    <div id="loading" data-i18n="loading">Loading NASA terrain…</div>
  </main>
</div>
<div class="modal" id="checkModal" hidden role="dialog" aria-modal="true" aria-labelledby="checkTitle"><div class="card" id="checkCard"></div></div>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="engine.js"></script>
<script type="importmap">

</script>

function setupCanvas(cv, H) { const dpr = Math.min(window.devicePixelRatio || 1, 2), W = Math.max(200, cv.clientWidth); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + 'px'; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return { g, W, H }; }

  g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(X(i0), 6, X(i0 + 156) - X(i0), 82);
  for (let i = i0; i < i0 + n && i < s.n; i++) { const f = a.sunFrac[i]; if (f > 0.02) { g.fillStyle = 'rgba(244,182,63,' + (0.3 + 0.7 * f).toFixed(2) + ')'; g.fillRect(X(i), 52 - 40 * f, Math.max(1, X(i + 1) - X(i) + 0.3), 40 * f); } }
  g.fillStyle = '#5ba9ff'; for (let i = i0; i < i0 + n && i < s.n; i++) if (a.earthUp[i]) g.fillRect(X(i), 62, Math.max(1, X(i + 1) - X(i) + 0.3), 14);
  g.strokeStyle = '#22304f'; g.beginPath(); g.moveTo(x0, 56.5); g.lineTo(x1, 56.5); g.stroke();
  g.fillStyle = '#8e9ab5'; g.font = '11px "IBM Plex Mono", monospace'; g.textAlign = 'center';
  for (let d = 0; d <= 30; d += 5) { const x = X(i0 + d * 24); g.fillRect(x, 80, 1, 5); const dd = new Date(s.t0 + (i0 + d * 24) * 36e5); g.fillText(dd.toLocaleDateString(LOC(), { timeZone: 'UTC', day: 'numeric', month: 'short' }), Math.min(Math.max(x, 22), W - 22), 99); }
}
function drawHorizon(cv, a) {
  if (!cv) return; const { g, W, H } = setupCanvas(cv, 176); const left = 30, right = W - 8, top = 8, bot = H - 22, eMin = -4, eMax = 14;
  const X = (az) => left + az / 360 * (right - left), Y = (el) => bot - (Math.max(eMin, Math.min(eMax, el)) - eMin) / (eMax - eMin) * (bot - top);

  g.textAlign = 'center'; ['N', 'E', 'S', 'W', 'N'].forEach((c, i) => g.fillText(c, X(i * 90), H - 6));
  g.beginPath(); g.moveTo(X(0), bot);

  g.lineTo(X(360), bot); g.closePath(); g.fillStyle = '#26314a'; g.fill(); g.strokeStyle = '#6a7899'; g.lineWidth = 1.2; g.stroke();
  const i0 = Math.round(state.slip * 24), s = state.series;
  for (let i = i0; i < Math.min(s.n, i0 + 720); i += 3) { const on = a.sunFrac[i] >= 0.5, inStay = i <= i0 + 156; g.fillStyle = on ? (inStay ? '#f4b63f' : 'rgba(244,182,63,0.35)') : 'rgba(244,182,63,0.12)'; g.fillRect(X(a.sunAz[i]) - 1, Y(a.sunEl[i]) - 1, inStay ? 3 : 2, inStay ? 3 : 2); }

function computePorkchop() {
  const start = new Date(state.date), pc = E.marsPorkchop(start, 820, 4, 110, 420, 8), win = [];

  for (const c of clusters) { const m = c.reduce((p, q) => q.c3 < p.c3 ? q : p); const dep = new Date(start.getTime() + pc.deps[m.i] * 864e5); win.push({ dep, arr: new Date(dep.getTime() + pc.tofs[m.j] * 864e5), tof: pc.tofs[m.j], c3: m.c3 }); }

function drawPorkchop(cv, pc) {

}

function copilotBrief() {

    + 'Rules: take every number from the tools; never invent or estimate values. Explain the physics in plain words and say what drives the result (terrain blocking the Sun, Earth sitting low near the pole, libration, the 6.5-day minimum stay). Reply in the language of the user\'s last message (Arabic or English). Keep replies under 130 words unless asked for more. Dates are UTC. Longitudes are degrees east (west = negative).\n'
    + 'You also answer questions about NASA landers on the Moon and Mars (crewed, landed, working now, lost, next and planned) using list_missions and show_mission; statuses were checked on 3-4 Nov 2026, planned sites are approximate targets, and dates for planned missions can slip.\n'

async function cpSend(text) {
  if (!sampleFn || cpBusy) return; cpBusy = true; if ($('#copilot').hidden) openCopilot();
  cpHistory.push({ role: 'user', content: text }); addMsg('user', text);
  const bubble = addMsg('assistant', t('cpThinking'));
  let hist = cpHistory.slice(-10); while (hist.length && hist[0].role !== 'user') hist = hist.slice(1);
  const msgs = hist.map((m) => ({ role: m.role, content: m.content }));
  msgs[msgs.length - 1] = { role: 'user', content: copilotBrief() + text };
  try {
    const res = await sampleFn(msgs, { tools: TOOLS, cache: false, onText: ({ text: tx }) => { bubble.textContent = tx; bubble.scrollIntoView({ block: 'end' }); } });
    bubble.textContent = res.text; cpHistory.push({ role: 'assistant', content: res.text });
  } catch (err) {
    const code = err && err.code; bubble.textContent = code === 'not_granted' ? t('cpDenied') : code === 'rate_limited' ? t('cpBusy') : t('cpError');
    if (code === 'not_granted') { sampleFn = null; }
    cpHistory.pop();
  } finally { cpBusy = false; }
}
