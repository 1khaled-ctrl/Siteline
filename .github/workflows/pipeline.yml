name: Pipeline

# Builds pipeline/out from the raw datasets and publishes it to R2, where deployed builds read it (DATA_BASE_URL).
# The bucket mirrors the local folders: raw/landfall/ holds pipeline/raw/landfall (the demo's assets, which the app also
# reads), and out/ holds pipeline/out. The SPICE kernels and the USGS names come straight from NAIF and USGS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # NASA's MEGDR tiles are 2 GB on a cold cache; every later run reads them from the cache below.
    timeout-minutes: 60
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the extra checksums that recent AWS CLI versions send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: R2 endpoint
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          endpoint="$(printf '%s' "${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}" | tr -d '[:space:]')"
          # The dashboard shows the S3 API URL with the bucket on the end. As an endpoint that puts the bucket in every
          # key, so every object 404s: keep only the scheme and host.
          host="$(printf '%s' "$endpoint" | sed -E 's#^(https?://[^/]+).*#\1#')"
          [ "$host" = "${endpoint%/}" ] || echo "::notice::R2_ENDPOINT had a path after the host; using the host only."
          echo "R2_URL=$host" >> "$GITHUB_ENV"
          # A pasted secret can carry a trailing newline or spaces.
          echo "R2_ROOT=s3://$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Check the bucket
        run: |
          aws s3 ls --endpoint-url "$R2_URL" "$R2_ROOT/raw/landfall/img/" > "$RUNNER_TEMP/listing.txt" || {
            echo "::error::Can't list raw/landfall/img/ in R2_BUCKET at this endpoint: check that R2_BUCKET is the bucket's name and that R2_ENDPOINT (or R2_ACCOUNT_ID) is the account that holds it."
            exit 1
          }
          grep -q ' mars_height.png$' "$RUNNER_TEMP/listing.txt" || {
            echo "::error::The bucket has no raw/landfall/img/mars_height.png: run the raw/landfall sync first."
            exit 1
          }

      # The kernels (about 50 MB) and the USGS names change rarely, so keep them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/raw/spice
            pipeline/raw/usgs
          key: raw-${{ hashFiles('pipeline/siteline_pipeline/kernels.py', 'pipeline/siteline_pipeline/mars_names.py') }}

      # NASA's 16 MEGDR tiles (2 GB) and its three illumination maps (150 MB), keyed on the configs that name them, so
      # a changed file list or checksum fetches afresh. The steps verify every file before reading it either way.
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/raw/mola
            pipeline/raw/illumination
          key: nasa-${{ hashFiles('pipeline/configs/*.yaml') }}

      - name: Download the raw datasets from R2
        run: |
          aws s3 cp --endpoint-url "$R2_URL" \
            "$R2_ROOT/raw/landfall/img/mars_height.png" pipeline/raw/landfall/img/mars_height.png
          # The close-ups step keeps the demo's close-ups in the file it writes, so it needs the demo's headers.
          aws s3 cp --endpoint-url "$R2_URL" \
            "$R2_ROOT/raw/landfall/data/sites.json" pipeline/raw/landfall/data/sites.json

      - name: Install the pipeline
        working-directory: pipeline
        run: uv sync --frozen

      - name: Ephemeris
        working-directory: pipeline
        run: uv run python -m siteline_pipeline.ephemeris

      # Each NASA-data step runs once its module is on main (#13, #11 and #9), so those PRs can land in any order.
      - name: Mars data
        working-directory: pipeline
        run: |
          uv run python -m siteline_pipeline.mars_names
          # The height map from NASA's own MEGDR tiles first, so the slope map below is derived from it.
          if [ -f siteline_pipeline/mars_height.py ]; then uv run python -m siteline_pipeline.mars_height; fi
          uv run python -m siteline_pipeline.mars_normal

      - name: South-pole close-ups
        working-directory: pipeline
        run: |
          if [ -f siteline_pipeline/site_patches.py ]; then uv run python -m siteline_pipeline.site_patches; fi

      - name: Long-term illumination
        working-directory: pipeline
        run: |
          if [ -f siteline_pipeline/illumination.py ]; then uv run python -m siteline_pipeline.illumination; fi

      - name: Check the outputs
        run: |
          for f in ephemeris/moon_sun_earth.bin ephemeris/planets.bin names/mars_names.json \
                   mars/mars_normal.png mars/mars_normal.manifest.json; do
            test -s "pipeline/out/$f" || { echo "::error::missing pipeline/out/$f"; exit 1; }
          done
          # The NASA-data outputs, wherever their step ran.
          for pair in mars_height.py:mars/mars_height.png site_patches.py:sites/sites.json \
                      illumination.py:illumination/maps.json; do
            module="${pair%%:*}"; out="${pair#*:}"
            if [ -f "pipeline/siteline_pipeline/$module" ]; then
              test -s "pipeline/out/$out" || { echo "::error::missing pipeline/out/$out"; exit 1; }
            fi
          done
          ls -lR pipeline/out

      - name: Upload pipeline/out to R2
        run: aws s3 sync --endpoint-url "$R2_URL" --no-progress pipeline/out "$R2_ROOT/out"
