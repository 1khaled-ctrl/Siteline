name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - name: Fetch the data files the tests read
        # Plain public reads from the R2 bucket, no secrets: raw/landfall/ mirrors pipeline/raw/landfall and out/ is
        # what the Pipeline workflow publishes from pipeline/out.
        env:
          BASE: https://pub-7be0ff89d7434202aff5f10a902675a5.r2.dev
        run: |
          get() { curl -fsSL --retry 3 --create-dirs -o "pipeline/$1" "$BASE/$1"; }
          for f in data/sites.json data/tracks.json data/earth.json data/earth10.json data/terrain.json \
                   img/moon_height.png img/mars_height.png; do
            get "raw/landfall/$f"
          done
          # One close-up per key in sites.json.
          for key in $(node -p "Object.keys(require('./pipeline/raw/landfall/data/sites.json')).join('\n')"); do
            get "raw/landfall/img/sites/$key.png"
          done
          for f in ephemeris/moon_sun_earth.bin ephemeris/planets.bin names/mars_names.json \
                   mars/mars_normal.png mars/mars_normal.manifest.json; do
            get "out/$f"
          done
      - run: corepack pnpm test
      - run: corepack pnpm build

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
